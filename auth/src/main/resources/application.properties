spring.application.name=auth
server.port=8081

spring.datasource.url=jdbc:postgresql://${AUTH_HOST:localhost}:${AUTH_PORT:5401}/${AUTH_DB:auth_db}
spring.datasource.username=${POSTGRES_USER:auth_user}
spring.datasource.password=${POSTGRES_PASSWORD:auth_pass}
spring.datasource.dbcp2.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

auth.jwt.secret=${JWT_SECRET:auth-jwt-secret-key-that-is-at-least-64-bytes-long}
auth.jwt.access-token-expiry-minutes=${TOKEN_EXPIRY_MINS:15}
auth.jwt.refresh-token-expiry-days=${REFERSH_TOKEN_EXPIRY_DAYS:7}
auth.jwt.issuer=finserve-auth

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}