spring.application.name=customer
server.port=8082

spring.datasource.url=jdbc:postgresql://${CUSTOMER_HOST:localhost}:${CUSTOMER_PORT:5402}/${CUSTOMER_DB:customer_db}
spring.datasource.username=${POSTGRES_USER:customer_user}
spring.datasource.password=${POSTGRES_PASSWORD:customer_pass}
spring.datasource.dbcp2.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}